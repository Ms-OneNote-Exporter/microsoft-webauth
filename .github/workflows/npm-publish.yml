name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # Required for OIDC trusted publishing
  # write, not read: the Release step below creates a Release, which is a
  # contents write. At read this step fails with a permissions error and the
  # repository accumulates tags with no Releases behind them.
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The Release step reads its notes out of the tag object, which the
          # default depth-1 fetch does not reliably carry. Fetching everything
          # is cheap here: this job is already paying for a Chromium download.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false  # never use caching in release builds

      # A mis-tagged release would publish the wrong version under a misleading
      # tag name, and the mistake is only visible after it is on the registry.
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "Publishing ${PKG_VERSION} from tag ${GITHUB_REF_NAME}"

      - run: npm ci

      # `npm ci` does not fetch a browser: the playwright package has no
      # postinstall script. Without this step the four browser-backed suites
      # skip themselves and `npm test` exits 0 having run 10 of 38 tests — so
      # the publish below would be gated on a suite that never once touched the
      # login flow, which is the only thing this package does. Measured, not
      # hypothetical: see the test suite's chromium guard.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run build --if-present
      - run: npm test
        env:
          # Belt and braces: if the install step above ever breaks, a skip must
          # still fail the release. Takes effect once the suite-side guard lands
          # in #19; inert until then, harmless in the meantime.
          PW_TESTS_REQUIRE_BROWSER: '1'

      # Never let a stray auth state file ride along in the tarball: these hold
      # live session cookies and MSAL tokens. A release must not depend on
      # .npmignore being complete. The report is written outside the package
      # directory so it cannot end up in the published tarball itself.
      - name: Verify tarball contains no auth state
        run: |
          PACK_JSON="$(mktemp)"
          npm pack --dry-run --json > "$PACK_JSON"
          node -e "
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('$PACK_JSON', 'utf8'));
            const files = report[0].files.map(f => f.path);
            const leaked = files.filter(f => /auth.*\.json$/i.test(f));
            if (leaked.length) {
              console.error('Refusing to publish, auth state in tarball:', leaked);
              process.exit(1);
            }
            console.log('Tarball is clean, ' + files.length + ' files');
          "
          rm -f "$PACK_JSON"

      - run: npm publish --access public --provenance

      # Publishing to npm and creating a Release are two different objects, and
      # only the first one was automated here: nine tags reached the registry
      # between v0.1.1 and v0.1.9 while the repository had a single Release,
      # hand-made back at v0.0.9, so the sidebar's "Latest" badge pointed three
      # months stale. Runs last, after the publish: a failed build must not
      # leave a Release behind advertising a version that never shipped.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="${RUNNER_TEMP}/release-notes.md"
          # The tag message is already the changelog; strip only the
          # "commit <sha>" trailer that git appends to it.
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed '/^commit /,$d' > "$NOTES"
          # A re-run of this workflow must not fail on the Release it made the
          # first time round.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists, leaving it untouched"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "$NOTES"
